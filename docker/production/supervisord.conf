; Keeps the four pieces of FloatBook running in one container. If any of them stops,
; supervisord starts it again; if the web server dies, the container exits so the
; platform can replace it.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
; The container is only useful while the web server is up.
exitcodes=0
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
; Emails and other background work. --max-time recycles the worker hourly so a leak
; can never build up; supervisord starts it again straight away.
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --backoff=10
user=www-data
autostart=true
autorestart=true
priority=20
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
; Daily summaries and the nightly demo rebuild. Both check whether they are due, so a
; sleeping service catches up when it wakes rather than skipping a day.
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
