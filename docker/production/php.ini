; Production PHP settings for FloatBook.

memory_limit = 256M
max_execution_time = 60

; Statement imports are capped at 5 MB in the app.
upload_max_filesize = 8M
post_max_size = 10M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

; Keep compiled PHP in memory: the free tier has little CPU to spare.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Sessions live in the database, not on disk (the disk is wiped on each deploy).
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
